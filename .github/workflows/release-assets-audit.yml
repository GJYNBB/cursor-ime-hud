name: Release Assets Audit

# Verifies that every published v* GitHub Release carries the complete asset
# set: the universal VSIX, one VSIX per helper target from the manifest, the
# JetBrains ZIP, and both CycloneDX SBOM files. Any missing asset fails the run.
#
# Trigger design: a `release: published` trigger would never fire here, because
# both packaging pipelines create the release with the default GITHUB_TOKEN and
# GitHub suppresses workflow runs for events caused by that token — and even if
# it fired, it would race the asset uploads that happen after `gh release
# create`. The audit therefore runs after each packaging pipeline completes for
# a tag (workflow_run), waits until neither pipeline is still active, and keeps
# a weekly cron as a backstop for assets removed after publication.
on:
  workflow_run:
    workflows: ["Release", "JetBrains Plugin Package"]
    types: [completed]
  schedule:
    # Weekly sweep so assets removed after publication are still caught.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Needed to poll the packaging workflows for in-progress runs.
  actions: read

jobs:
  audit:
    name: Audit release assets
    # workflow_run also fires for branch/PR builds of the packaging pipelines;
    # only tag builds (head_branch is the v* tag) publish assets worth auditing.
    if: github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # The VSIX and JetBrains pipelines attach their assets independently, so
      # auditing right after the first one finishes would report the other
      # pipeline's assets as missing. Wait until both are quiet.
      - name: Wait for packaging pipelines to finish
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            active=0
            for workflow in release.yml jetbrains-package.yml; do
              for status in in_progress queued; do
                count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=${status}&per_page=1" --jq '.total_count')
                active=$(( active + count ))
              done
            done
            if [ "$active" -eq 0 ]; then
              echo "No packaging pipeline runs active; auditing now."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for packaging pipelines to finish." >&2
              exit 1
            fi
            echo "Waiting for $active active packaging pipeline run(s)..."
            sleep 30
          done

      - name: Audit release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { allHelpers } = require('./scripts/helper-platforms');

          const token = process.env.GITHUB_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;

          // Known exemptions from the full asset audit, keyed by tag.
          const exemptions = new Map([
            ['v0.1.1', 'superseded by 0.1.2, no artifacts']
          ]);

          function expectedAssets(version) {
            const names = [`cursor-ime-hud-${version}.vsix`];
            for (const helper of allHelpers()) {
              names.push(`cursor-ime-hud-${version}-${helper.targetKey}.vsix`);
            }
            names.push(`cursor-ime-hud-jetbrains-${version}.zip`);
            names.push(`cursor-ime-hud-${version}-vsix.cdx.json`);
            names.push(`cursor-ime-hud-${version}-jetbrains.cdx.json`);
            return names;
          }

          async function fetchReleases() {
            const releases = [];
            for (let page = 1; ; page += 1) {
              const response = await fetch(
                `https://api.github.com/repos/${repo}/releases?per_page=100&page=${page}`,
                {
                  headers: {
                    Accept: 'application/vnd.github+json',
                    Authorization: `Bearer ${token}`,
                    'X-GitHub-Api-Version': '2022-11-28'
                  }
                }
              );
              if (!response.ok) {
                throw new Error(`GitHub API returned ${response.status} while listing releases.`);
              }
              const batch = await response.json();
              releases.push(...batch);
              if (batch.length < 100) {
                return releases;
              }
            }
          }

          async function main() {
            const failures = [];
            let audited = 0;
            for (const release of await fetchReleases()) {
              if (release.draft || !/^v\d+\.\d+\.\d+$/.test(release.tag_name)) {
                continue;
              }
              if (exemptions.has(release.tag_name)) {
                console.log(`[exempt] ${release.tag_name}: ${exemptions.get(release.tag_name)}`);
                continue;
              }
              audited += 1;
              const present = new Set(release.assets.map((asset) => asset.name));
              const missing = expectedAssets(release.tag_name.slice(1)).filter(
                (name) => !present.has(name)
              );
              if (missing.length > 0) {
                failures.push({ tag: release.tag_name, missing });
                continue;
              }
              console.log(`[ok] ${release.tag_name}: all expected assets present`);
            }

            if (audited === 0 && failures.length === 0) {
              console.log('No non-exempt v* releases found to audit.');
              return;
            }
            for (const failure of failures) {
              console.error(`[fail] ${failure.tag} is missing release assets:`);
              for (const name of failure.missing) {
                console.error(`  - ${name}`);
              }
            }
            if (failures.length > 0) {
              process.exit(1);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
